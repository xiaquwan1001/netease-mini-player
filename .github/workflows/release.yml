name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 发布门: tag 之前必须先在**同一 commit**上跑过测试, 否则打 tag 就能把红的代码发出去。
  # (CI 的 ci.yml 只在 main push / PR 上跑, tag 上的 release 与它是两条独立流水线。)
  verify:
    name: Tests gate before release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag / pubspec 版本一致性
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUB=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' ui/pubspec.yaml | head -1)
          META=$(sed -n "s/.*kAppVersion = '\([^']*\)'.*/\1/p" ui/lib/src/app_meta.dart | head -1)
          echo "tag=$TAG pubspec=$PUB kAppVersion=$META"
          if [ "$TAG" != "$PUB" ] || [ "$PUB" != "$META" ]; then
            echo "::error::版本号不一致(tag/pubspec/kAppVersion), 请用 tools/bump-version.sh 后重新打 tag"
            exit 1
          fi
      - name: System deps (alsa for cpal)
        # 走带重试的包装: runner 偶发 DNS 解析失败会让 apt 直接红(2026-11-11 实测)
        run: bash tools/apt-install.sh libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: cargo test (workspace, vendor 联网 smoke 排除)
        run: cargo test --manifest-path core/Cargo.toml --workspace --exclude ncm-api-rs --locked
      - name: write-guard (测试不得直连写接口, 发版不触网)
        run: bash tools/check-write-guard.sh
      - name: pub get + analyze + widget tests
        working-directory: ui
        run: |
          flutter pub get
          dart analyze
          flutter test --exclude-tags network

  # ---- Android(arm64) + Linux(x64) ----
  build:
    name: Build Android + Linux assets
    runs-on: ubuntu-24.04
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub 的 ubuntu 镜像自带 Android SDK, 但**没有** NDK 28.2;
      # 不能用 android-actions/setup-android(GitHub 已移除 'tools' 包, 该 action 会直接失败),
      # 这里直接用镜像里的 sdkmanager 装 NDK / platform / build-tools。
      - name: Android SDK components (NDK 28.2)
        run: |
          SDKMANAGER=$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: System deps (Linux build + alsa for cpal)
        run: bash tools/apt-install.sh clang cmake ninja-build pkg-config libgtk-3-dev \
          libasound2-dev liblzma-dev libstdc++-12-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        working-directory: ui
        run: flutter pub get

      # 正式签名: 在仓库 Secrets 里配置(见 docs/android-signing.md)
      # 注意: secrets 上下文不能用在 `if:` 里(workflow 会解析失败), 只能经 env 传入后在 shell 里判断。
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64 —— 本次 APK 用 debug 签名, 无法覆盖升级此前发布版本"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ui/android/release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/ui/android/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > ui/android/key.properties
          echo "已写入 key.properties, alias=$KEY_ALIAS"

      - name: Build Android APK (arm64, release)
        working-directory: ui
        run: flutter build apk --release --target-platform android-arm64

      # 自检: 配了正式 keystore 就不许产出 debug 签名的包
      - name: Verify APK signature
        run: |
          APK=ui/build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E 'certificate (DN|SHA-256)' || true
          if [ -f ui/android/key.properties ]; then
            if "$APKSIGNER" verify --print-certs "$APK" | grep -q 'CN=Android Debug'; then
              echo "::error::APK 仍是 debug 签名(应为正式 keystore)"
              exit 1
            fi
            echo "正式签名 OK"
          fi

      - name: Build Linux bundle (release)
        working-directory: ui
        run: flutter build linux --release

      # 回归门(issue #2): 构建机 GLib 头文件 >= 2.80 时, G_DEFINE_TYPE 会展开成
      # g_once_init_enter_pointer(Since 2.80), 产物在 Ubuntu 22.04(GLib 2.72)上启动即
      # symbol lookup error。ui/linux/CMakeLists.txt 把 GLib 基线钉到 2.72,
      # 这里再在产物上验一遍, 防止哪天被模板更新/别的构建改动带回来。
      - name: Verify GLib baseline (Ubuntu 22.04 compatibility)
        run: |
          BUNDLE=ui/build/linux/x64/release/bundle
          BAD=$(nm -D --undefined-only "$BUNDLE/minincm" | grep -oE 'g_once_init_(enter|leave)_pointer' | sort -u || true)
          if [ -n "$BAD" ]; then
            echo "::error::minincm 引用了 GLib 2.80 才有的符号: $BAD —— Ubuntu 22.04 会起不来"
            exit 1
          fi
          echo "GLib 符号基线 OK: runner 只用 <= 2.72 的 GLib 符号"

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in v*) ;; *) VERSION=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' ui/pubspec.yaml);; esac
          mkdir -p dist
          cp ui/build/app/outputs/flutter-apk/app-release.apk "dist/MiniNCM-${VERSION}-android-arm64.apk"
          tar -C ui/build/linux/x64/release -czf "dist/MiniNCM-${VERSION}-linux-x64.tar.gz" bundle

      # 桌面分发: deb(apt 安装) + AppImage(免安装单文件)。同一套脚本本地也能跑, 见 packaging/linux/。
      - name: Package Linux (deb + AppImage)
        run: |
          bash packaging/linux/build-deb.sh "$PWD/dist"
          bash packaging/linux/build-appimage.sh "$PWD/dist"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: assets-android-linux
          path: dist/*

  # ---- Linux(arm64) ----
  # Flutter 桌面不支持交叉编译 ⇒ arm64 包必须在 arm64 runner 上原生构建。
  # 与 x64 的 build job 分开: Android 那套 SDK/keystore 步骤在 arm64 上不需要也不该跑。
  # 暂不出 arm64 的 AppImage(appimagetool 的 aarch64 产物本机没验过, 先只发 tar.gz + deb)。
  build-linux-arm64:
    name: Build Linux arm64 assets
    runs-on: ubuntu-24.04-arm
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - name: System deps (Linux build + alsa for cpal)
        run: bash tools/apt-install.sh clang cmake ninja-build pkg-config libgtk-3-dev \
          libasound2-dev liblzma-dev libstdc++-12-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: linux-arm64

      # 不用 subosito/flutter-action: 它在 linux-arm64 上固定报
      #   "Unable to determine Flutter version for channel: stable version: 3.47.9
      #    architecture: arm64"
      # (显式 flutter-version 也一样, 见 v0.4.0/v0.5.0 两次 Release 实测),
      # 改为从官方 git 源直装并预拉 linux 引擎产物。
      - name: Install Flutter 3.47.9 (arm64)
        run: |
          git clone --depth 1 -b 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Flutter precache (linux)
        run: |
          flutter --version
          flutter config --no-analytics >/dev/null
          flutter precache --linux

      - name: pub get
        working-directory: ui
        run: flutter pub get

      - name: Build Linux bundle (release, arm64)
        working-directory: ui
        run: flutter build linux --release

      - name: Verify arch + GLib baseline
        run: |
          BUNDLE=ui/build/linux/arm64/release/bundle
          file "$BUNDLE/minincm"
          file "$BUNDLE/minincm" | grep -q 'ARM aarch64' || { echo "::error::产物不是 aarch64"; exit 1; }
          BAD=$(nm -D --undefined-only "$BUNDLE/minincm" | grep -oE 'g_once_init_(enter|leave)_pointer' | sort -u || true)
          if [ -n "$BAD" ]; then
            echo "::error::minincm 引用了 GLib 2.80 才有的符号: $BAD —— Ubuntu 22.04 会起不来"
            exit 1
          fi
          echo "arm64 产物与 GLib 基线 OK"

      - name: Package (tar.gz + deb)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in v*) ;; *) VERSION=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' ui/pubspec.yaml);; esac
          mkdir -p dist
          tar -C ui/build/linux/arm64/release -czf "dist/MiniNCM-${VERSION}-linux-arm64.tar.gz" bundle
          bash packaging/linux/build-deb.sh "$PWD/dist"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: assets-linux-arm64
          path: dist/*

  # ---- Windows(x64) ----
  # Flutter 桌面不支持交叉编译 ⇒ 必须在 windows-latest 上出包。
  build-windows:
    name: Build Windows x64 asset
    runs-on: windows-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop + pub get
        working-directory: ui
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows (release)
        working-directory: ui
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $ver = (Select-String -Path ui/pubspec.yaml -Pattern '^version: ([0-9.]+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $ver = $env:GITHUB_REF_NAME -replace '^v','' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path ui/build/windows/x64/runner/Release/* -DestinationPath "dist/MiniNCM-$ver-windows-x64.zip"
          "APP_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem dist | Format-Table Name, Length

      # 安装包(Inno Setup): 开始菜单/桌面快捷方式 + 卸载项; 免安装 zip 仍然保留。
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # 简中向导语言包: choco 的 innosetup(6.7.1)官方安装包不带 ChineseSimplified.isl,
      # issrc 7.x 起才内置。把随包语言包拷进编译器 Languages\ 目录; 编译器已有(7.x)则不覆盖。
      - name: Install Chinese Simplified language for Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }
          $target = Join-Path (Join-Path (Split-Path $iscc -Parent) 'Languages') 'ChineseSimplified.isl'
          if (Test-Path $target) {
            Write-Host "编译器已自带 $target, 跳过拷贝"
          } else {
            Copy-Item "packaging\windows\ChineseSimplified.isl" $target
            Write-Host "已拷贝随包语言包到 $target"
          }

      - name: Build installer (exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DAppVersion=$env:APP_VER" "/O$PWD\dist" "packaging\windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败: $LASTEXITCODE" }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: assets-windows
          path: dist/*

  # ---- 统一发布: 收齐三端产物 + 一份 SHA256SUMS, 只在这里创建/更新 Release ----
  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [build, build-windows, build-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
