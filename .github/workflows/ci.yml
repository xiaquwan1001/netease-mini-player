name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps (alsa for cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: cargo test (workspace, vendor network smoke excluded)
        run: cargo test --manifest-path core/Cargo.toml --workspace --exclude ncm-api-rs --locked

  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: pub get
        working-directory: ui
        run: flutter pub get
      - name: analyze
        working-directory: ui
        run: dart analyze
      - name: write-guard (测试不得直连写接口, CI 不触网)
        run: bash tools/check-write-guard.sh
      - name: widget/unit tests (offline)
        working-directory: ui
        run: flutter test --exclude-tags network

  # Flutter 桌面不支持交叉编译 ⇒ arm64 只能在 arm64 runner 上原生构建。
  # GitHub 托管的 arm64 标签是 ubuntu-24.04-arm(公开仓库免费)。
  build-linux:
    name: Build Linux bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [rust, flutter]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev liblzma-dev libstdc++-12-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: linux-${{ matrix.arch }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: build
        working-directory: ui
        run: flutter pub get && flutter build linux --debug
      - name: verify arch
        run: |
          file ui/build/linux/${{ matrix.arch }}/debug/bundle/minincm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debug-bundle-${{ matrix.arch }}
          path: ui/build/linux/${{ matrix.arch }}/debug/bundle
          if-no-files-found: error
