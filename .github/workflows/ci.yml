name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps (alsa for cpal)
        run: bash tools/apt-install.sh libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # 命令的唯一实现在 tools/ci-gates.sh(本地 tools/ci.sh / release.yml 调同一处),
      # workflow 里不再手抄 cargo/dart/flutter 参数(2026-11-16 审计 P-13)。
      - name: cargo fmt --check + clippy (-D warnings)
        run: bash tools/ci-gates.sh rust-lint
      - name: cargo test (workspace, vendor network smoke excluded)
        run: bash tools/ci-gates.sh rust-test

  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9   # 固定版本: runner 的 stable 已漂到 3.50, 要求 AGP>=9.1.1/Gradle>=9.5, 与本地 3.47.9 不一致
          cache: true
      # golden(视觉回归)靠 FontLoader 直接读系统 CJK 字体, 缺了用例会整组 skip
      # (等于没测); 干净 runner 没有中文字体, 所以先装(走带重试+镜像兜底的包装)。
      - name: System deps (fonts-noto-cjk, golden 视觉基准需要)
        run: bash tools/apt-install.sh fonts-noto-cjk
      - name: pub get
        working-directory: ui
        run: flutter pub get
      - name: analyze (dart analyze)
        run: bash tools/ci-gates.sh dart-analyze
      - name: format check (dart format, 只读不写)
        run: bash tools/ci-gates.sh dart-format
      - name: write-guard (测试不得直连写接口, CI 不触网)
        run: bash tools/ci-gates.sh write-guard
      # token 门(间距/圆角/字号白名单)与 write-guard 以前只在本地 tools/ci.sh 里,
      # GitHub CI 没跑 —— AGENTS.md 说它们是"固定门"却没人守(审计 P-14)。
      - name: design token 门 (间距/圆角/字号只允许有限集合)
        run: bash tools/ci-gates.sh tokens
      # 浮层入口门(U-03): 业务代码里不许再直连 showModalBottomSheet / showDialog,
      # 只许走 ui/lib/src/app_sheet.dart 的 showAppSheet / showAppDialog。
      - name: 浮层入口门 (sheet/dialog 只许经 app_sheet.dart)
        run: bash tools/ci-gates.sh sheet-entry
      # 文档门(2026-11-19): 链接死链 + docs/ 根索引覆盖。纯 python3(标准库), 不依赖 Flutter,
      # 放进本 job 只是为了"CI 门清单与 verify 一致", 跑起来 <1s。
      - name: 文档门 (相对链接死链 + docs 根索引)
        run: bash tools/ci-gates.sh docs
      # 唯一的全量测试入口: 含 golden(18 张整屏像素)。只排除 network —— CI 没有
      # 出口网络与凭据。golden 的渲染环境靠上一步的 fonts-noto-cjk + 固定的
      # Flutter 3.47.9 对齐本地。口径与 release.yml / tools/ci.sh 完全一致(P-13)。
      - name: widget/unit tests + golden (offline)
        run: bash tools/ci-gates.sh flutter-test

  # ---- Android JVM 门(平台审计 P-14 的剩余部分) ----
  # 命令的唯一实现仍是 tools/ci-gates.sh: 这里不写 gradle 任务名/参数, 也不手抄
  # local.properties 与 gradlew —— 两者都被 ui/android/.gitignore 排除, 新克隆里
  # 不存在, 由门内的 `flutter build apk --config-only` 现场生成(审计 P-13 的教训)。
  android:
    name: Android JVM (unit tests + lintDebug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NDK 28.2 从 2026-11-21 起必须: 插件宿主的 rquickjs 在 Android 目标走构建期 bindgen,
      # 而 lintDebug / testDebugUnitTest 会触发 cargokit 编 Android 目标的 Rust。
      - name: Android SDK components (platform 36 + build-tools + NDK 28.2)
        run: |
          SDKMANAGER=$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # bindgen 的 libclang(build-time 依赖)。
      - name: Install libclang (bindgen for rquickjs on Android)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9   # 固定版本: runner 的 stable 已漂到 3.50, 要求 AGP>=9.1.1/Gradle>=9.5, 与本地 3.47.9 不一致
          cache: true

      # 阻塞门: 三端共享夹具 ui/test/fixtures/eq_profile_cases.json 的 Kotlin 解析单测
      # (EqProfileParserFixtureTest, 3 条; 本机 21s, 首次含依赖下载 5–15min)。
      - name: JVM 单测 (:app:testDebugUnitTest)
        run: bash tools/ci-gates.sh android-unit

      # lintDebug **阻塞门**(2026-11-18 起): error 已清到 0(66 × media3
      # UnsafeOptInUsageError 收口到类级 @OptIn/@UnstableApi, LoginActivity 的
      # onBackPressed 迁到 OnBackPressedDispatcher), 同时已进 `ci-gates.sh verify`。
      # 剩下的 9 warning 全是依赖版本提示(GradleDependency), 不阻塞。
      # 仍**不许**建 lint-baseline/lint.xml 掩盖错误。
      - name: lintDebug (阻塞门)
        run: bash tools/ci-gates.sh android-lint

      - name: upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            ui/build/app/reports/lint-results-debug.txt
            ui/build/app/reports/lint-results-debug.html
          if-no-files-found: ignore

  # 可直接安装的 **debug APK**(给模拟器/真机做视觉与回归验收)。
  #
  # 为什么单独出一个: release 流水线只产 arm64 正式签名包, 模拟器(x86_64)装不上;
  # 本地每改一行都要 `bash tools/build-android.sh` + adb install 才能验收, 太慢。
  #
  # 用 --split-per-abi: 不分割时 debug 是 170MB 的 universal 包(四套 ABI 全塞);
  # 分割后 x86_64≈88MB / arm64≈99MB, 且每个包只含自己的 libncm_ffi.so。
  # 下载: Actions 运行页 → Artifacts → minincm-debug-apk
  build-android-debug:
    name: Debug APK (x86_64 + arm64)
    runs-on: ubuntu-24.04
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 与 release.yml 同一套: 镜像自带 SDK 但没有 NDK 28.2;
      # 不能用 android-actions/setup-android(GitHub 已移除 'tools' 包)。
      - name: Android SDK components (NDK 28.2)
        run: |
          SDKMANAGER=$(command -v sdkmanager || ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # 插件宿主的 rquickjs 在 Android 目标用构建期 bindgen ⇒ build-time 依赖 libclang(不进产物)。
      - name: Install libclang (bindgen for rquickjs on Android)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev

      # 四个 Android target 全装: 产物只留 arm64 + x86_64(--target-platform 限制),
      # 但 cargokit 在构建期会按它认得的 ABI 列表逐个编, 缺 target 会直接报错。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android-debug

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9   # 固定版本: runner 的 stable 已漂到 3.50(要求 AGP>=9.1.1/Gradle>=9.5)
          cache: true

      - name: build debug APKs (split per ABI)
        working-directory: ui
        # 过 tools/android-bindgen-env.sh: 插件宿主的 rquickjs 在 Android 目标用构建期 bindgen,
        # 需要 NDK sysroot + libclang(见 docs/audit/2026-11-21-plugin-android-crosscompile.md).
        run: |
          ../../../tools/android-bindgen-env.sh bash -c '
            set -euo pipefail
            flutter pub get
            # 必须带 --target-platform, 否则 --split-per-abi 会试图编 32 位包而失败
            flutter build apk --debug --split-per-abi --target-platform android-arm64,android-x64
          '

      - name: collect + verify ABI
        run: |
          SRC=ui/build/app/outputs/flutter-apk
          mkdir -p dist
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          check() {  # $1=源文件 $2=目标文件名 $3=必须存在的 so 路径 $4=不得出现的 so 路径
            cp "$SRC/$1" "dist/$2"
            "$AAPT" dump badging "dist/$2" | grep -E '^package:|application-label:'
            unzip -l "dist/$2" | grep -q "$3" || { echo "::error::$2 缺少 $3"; exit 1; }
            if [ -n "$4" ] && unzip -l "dist/$2" | grep -q "$4"; then
              echo "::error::$2 混入了其他 ABI 的 native 库($4)"; exit 1
            fi
            ls -lh "dist/$2"
          }
          check app-x86_64-debug.apk    MiniNCM-debug-x86_64.apk lib/x86_64/libncm_ffi.so        lib/arm64-v8a/libncm_ffi.so
          check app-arm64-v8a-debug.apk MiniNCM-debug-arm64.apk  lib/arm64-v8a/libncm_ffi.so     lib/x86_64/libncm_ffi.so

      - uses: actions/upload-artifact@v4
        with:
          name: minincm-debug-apk
          path: |
            dist/MiniNCM-debug-x86_64.apk
            dist/MiniNCM-debug-arm64.apk
          if-no-files-found: error

  # Flutter 桌面不支持交叉编译 ⇒ arm64 只能在 arm64 runner 上原生构建。
  # GitHub 托管的 arm64 标签是 ubuntu-24.04-arm(公开仓库免费)。
  build-linux:
    name: Build Linux bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [rust, flutter]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        # 一行写完: YAML 普通标量会把行尾 \\ 折叠成 " \\ ", bash 解析出带前导空格的
        # " libasound2-dev" 参数 ⇒ apt 报 'Unable to locate package  libasound2-dev'
        # (2026-11-12 定位: 双空格就是这个 bug 的指纹)。
        run: bash tools/apt-install.sh clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev libdbus-1-dev liblzma-dev libstdc++-12-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: linux-${{ matrix.arch }}
      # x64 腿用 action(带缓存); arm64 腿改用官方 git 源直装 ——
      # subosito/flutter-action 在 linux-arm64 上固定解析失败
      # ("Unable to determine Flutter version ... architecture: arm64")
      - name: Install Flutter (x64, via action)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9   # 固定版本: runner 的 stable 已漂到 3.50, 要求 AGP>=9.1.1/Gradle>=9.5, 与本地 3.47.9 不一致
          cache: true
      - name: Install Flutter 3.47.9 (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics >/dev/null
          "$RUNNER_TEMP/flutter/bin/flutter" precache --linux
      - name: build
        working-directory: ui
        run: flutter pub get && flutter build linux --debug
      - name: verify arch
        run: |
          file ui/build/linux/${{ matrix.arch }}/debug/bundle/minincm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-debug-bundle-${{ matrix.arch }}
          path: ui/build/linux/${{ matrix.arch }}/debug/bundle
          if-no-files-found: error
