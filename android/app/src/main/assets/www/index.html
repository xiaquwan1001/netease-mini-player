<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>轻音</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <!-- 登录视图: 自绘二维码(eapi 扫码登录接口, 无网页壳) -->
  <section id="view-login" class="view">
    <div class="login-box">
      <div class="logo">♪</div>
      <h1>轻音</h1>
      <p class="sub">网易云音乐 · 极简第三方客户端</p>
      <div id="qr"><div class="tip">加载中...</div></div>
      <div id="qr-status" class="qr-status">准备中…</div>
      <button id="btn-qr-refresh" class="ghost">刷新二维码</button>
      <div class="alt-row">
        <button id="btn-web-login" class="link">官方网页登录</button>
        <button id="btn-guest" class="link">先逛逛（免登录）</button>
      </div>
      <p class="legal">扫码即登录 · 登录态仅存本机</p>
    </div>
  </section>

  <!-- 主视图: 搜索 + 歌单 -->
  <section id="view-main" class="view hidden">
    <header class="topbar">
      <input id="search-input" type="search" placeholder="搜索歌曲 / 歌手" autocomplete="off">
      <span id="user-badge" title="退出登录">·</span>
    </header>
    <div id="search-result" class="list"><div class="tip">输入关键词搜索</div></div>
  </section>

</div>

<!-- 底部迷你播放条 -->
<div id="mini-player" class="hidden">
  <div class="mini-info">
    <div id="mini-title">未播放</div>
    <div id="mini-artist"></div>
  </div>
  <div class="mini-ctrl">
    <button id="btn-prev">⏮</button>
    <button id="btn-toggle">▶</button>
    <button id="btn-next">⏭</button>
  </div>
</div>

<script src="js/lib/crypto-js.min.js"></script>
<script src="js/lib/qrcode.min.js"></script>
<script src="js/core/bridge.js"></script>
<script src="js/plugins/provider/netease.js"></script>
<script src="js/plugins/provider/remote.js"></script>
<script src="js/core/app.js"></script>
</body>
</html>
