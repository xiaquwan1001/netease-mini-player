distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# distributionUrl 指向腾讯镜像: 国内开发机直连 services.gradle.org 常卡死/超时。
# 这是**开发机可移植性单点**(平台审计 P-15): 非中国网络或镜像临时不可用时, gradle 分发
# 包会在依赖解析之前就拉取失败, 表现是 `flutter build apk` 直接红。
# 换官方源不需要改这个文件, 任选一种本地覆盖:
#   1) 一次性: ./gradlew wrapper --gradle-distribution-url https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
#   2) 只在本机生效: 在 $GRADLE_USER_HOME/init.d/ 下放一个 .gradle 脚本改写 distributionUrl,
#      或直接改 $GRADLE_USER_HOME/wrapper/dists 里已有的分发包缓存(不要提交)。
# 版本号(9.3.1)必须与 AGP/Kotlin 匹配, 换源只换 host 不建议换版本。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip
