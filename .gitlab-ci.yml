# USTC GitLab CI（与 GitHub Actions 对齐：test 全跑；tag 上出 Linux/Android 产物）
# 本机 runner：宿主工具链直跑（校园网直连，artifact 拉取比 GitHub 快），
# 不建 arm64 包、不做 Windows（GitHub 侧仍负责 arm64/windows）。
stages: [test, build]

default:
  interruptible: true

before_script:
  - export PATH="$HOME/android-dev/flutter/bin:$HOME/android-dev/bin:$HOME/.cargo/bin:$HOME/bin:$PATH"

variables:
  CARGO_TERM_COLOR: always
  FLUTTER_ROOT: /home/xuqianhui/android-dev/flutter

rust:
  stage: test
  timeout: 40m
  script:
    - cargo test --manifest-path core/Cargo.toml --workspace --exclude ncm-api-rs --locked

flutter:
  stage: test
  timeout: 40m
  script:
    - flutter --version
    - flutter config --no-analytics >/dev/null
    - (cd ui && flutter pub get)
    - (cd ui && dart analyze)
    - bash tools/check-write-guard.sh
    - (cd ui && flutter test --exclude-tags network)

# ---------- 产物：只在 tag 上跑（或手动触发），产物可直接从 GitLab 下载 ----------

.build_rules: &build_rules
  - if: $CI_COMMIT_TAG
  - if: $CI_COMMIT_BRANCH
    when: manual
  - when: never

build-linux-x64:
  stage: build
  timeout: 60m
  rules: *build_rules
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - if [ -z "$VERSION" ]; then VERSION=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' ui/pubspec.yaml); fi
    - echo "building v$VERSION"
    - (cd ui && flutter pub get && flutter build linux --release)
    # GLib 2.80 基线回归门（同 GitHub release.yml）
    - BUNDLE=ui/build/linux/x64/release/bundle
    - BAD=$(nm -D --undefined-only "$BUNDLE/minincm" | grep -oE 'g_once_init_(enter|leave)_pointer' | sort -u || true)
    - if [ -n "$BAD" ]; then echo "minincm 引用了 GLib 2.80 才有的符号: $BAD"; exit 1; fi
    - mkdir -p dist
    - tar -C ui/build/linux/x64/release -czf "dist/MiniNCM-${VERSION}-linux-x64.tar.gz" bundle
    - bash packaging/linux/build-deb.sh "$PWD/dist"
    - bash packaging/linux/build-appimage.sh "$PWD/dist"
    - ls -lh dist
  artifacts:
    name: "MiniNCM-${CI_COMMIT_TAG:-manual}-linux-x64"
    paths: [dist/*]
    expire_in: 30 days

build-android-arm64:
  stage: build
  timeout: 60m
  rules: *build_rules
  script:
    - export ANDROID_HOME="$HOME/android-dev/sdk" ANDROID_SDK_ROOT="$HOME/android-dev/sdk"
    - export JAVA_HOME="$HOME/android-dev/jdk"
    - VERSION="${CI_COMMIT_TAG#v}"
    - if [ -z "$VERSION" ]; then VERSION=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' ui/pubspec.yaml); fi
    # 正式签名材料放在仓库外（$HOME/.config/minincm-android/key.properties，600 权限）；
    # 没有就退回 debug 签名并在产物名里标出来，绝不冒充正式包。
    - |
      SIGN=release
      if [ -f "$HOME/.config/minincm-android/key.properties" ]; then
        cp "$HOME/.config/minincm-android/key.properties" ui/android/key.properties
      else
        SIGN=debug-signed
        echo "WARN: 无 key.properties, 本次 APK 用 debug 签名"
      fi
      (cd ui && flutter pub get && flutter build apk --release --target-platform android-arm64)
      mkdir -p dist
      cp ui/build/app/outputs/flutter-apk/app-release.apk "dist/MiniNCM-${VERSION}-android-arm64-${SIGN}.apk"
      ls -lh dist
  artifacts:
    name: "MiniNCM-${CI_COMMIT_TAG:-manual}-android-arm64"
    paths: [dist/*]
    expire_in: 30 days
