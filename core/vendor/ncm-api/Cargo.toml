[package]
name = "ncm-api-rs"
version = "0.1.0"
edition = "2021"
description = "Netease Cloud Music API Rust SDK"
license = "WTFPL"
repository = "https://github.com/SPlayer-Dev/ncm-api-rs"
homepage = "https://github.com/SPlayer-Dev/ncm-api-rs"

[features]
default = []
# 注意: 上游的 `server` 特性(axum HTTP 服务端 + src/bin/server.rs)已在本仓裁剪掉。
# 理由: 本项目是内嵌客户端形态(FFI 直接调库), 从未启用该特性; 且它依赖的
# avatar_upload/voice_upload 等 endpoint 未接入已被删, 启用即 E0599(死特性)。
# 上游原文可由 core/vendor/UPSTREAM.txt 的锁定 commit 找回。

[dependencies]
# HTTP
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls", "socks"], default-features = false }
# Async: 库本体不直接用 tokio(HTTP 走 reqwest), 只有 dev-dependencies 的测试用。
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
# Crypto
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
# Utils
thiserror = "2"
urlencoding = "2"
chrono = "0.4"
regex-lite = "0.1"
[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
