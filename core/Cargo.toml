[workspace]
resolver = "2"
members = [
    "crates/ncm-domain",
    "crates/ncm-provider",
    "crates/ncm-service",
    "crates/ncm-playback",
    # 实验性插件宿主(未接入产品: 没有 FFI 导出/没注册进 ProviderRegistry, 不进 APK 默认路径)。
    # 2026-11-20 切片 2 第一步起 ncm-service 依赖它(plugins::ReqwestTransport), 所以
    # rust-lint/rust-test 按 workspace 全量跑它(不再 --exclude, 独立门 rust-plugin 已删)。
    # 接入条件见 docs/remaining-batches.md §11.C。
    "crates/ncm-plugin",
    "crates/ncm-cli",
    "crates/ncm-ffi",
    "vendor/ncm-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ncm-domain = { path = "crates/ncm-domain" }
ncm-provider = { path = "crates/ncm-provider" }
ncm-service = { path = "crates/ncm-service" }
ncm-playback = { path = "crates/ncm-playback" }
ncm-plugin = { path = "crates/ncm-plugin" }
ncm-api-rs = { path = "vendor/ncm-api", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
thiserror = "2"

# release 产物调优(2026-11-28 构建链审计 #4): 此前一个键都没有 ⇒ 默认 lto=false /
# codegen-units=16, arm64 的 libncm_ffi.so 7.8MB。
# - thin LTO + codegen-units=1: 跨 crate 内联, .so 预期小 10~20%(构建变慢, 只影响 release);
# - strip = "debuginfo": 发布件不需要调试信息(崩溃栈靠 Dart/Rust 侧的 panic 信息);
# - **不要** panic = "abort": FFI 侧有 catch_unwind 语义(ncm-ffi 的边界捕获),
#   abort 会让一次 panic 直接杀进程。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
