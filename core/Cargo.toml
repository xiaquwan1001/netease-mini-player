[workspace]
resolver = "2"
members = ["crates/ncm-domain", "crates/ncm-provider", "crates/ncm-service", "crates/ncm-cli", "crates/ncm-ffi", "vendor/ncm-api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ncm-domain = { path = "crates/ncm-domain" }
ncm-provider = { path = "crates/ncm-provider" }
ncm-service = { path = "crates/ncm-service" }
ncm-playback = { path = "crates/ncm-playback" }
ncm-api-rs = { path = "vendor/ncm-api", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
