[package]
name = "ncm-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ncm-domain.workspace = true
ncm-provider.workspace = true
ncm-api-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["sync"] }
# stream: 桌面端"边下边播"(cache::AudioCache::download_progressive)要按块读响应体
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# P0 Windows DPAPI 后端(credential_store.rs 的 dpapi 模块). windows-sys 0.61 已在
# 依赖树里(Cargo.lock), 选 0.61 与树中多数一致; 只开 Cryptography 所需的两个
# feature(近零增量, 且 windows-sys 是 link-only crate, 不引入编译期依赖).
# 仅 cfg(windows) 生效, Linux/Android 构建完全不受影响.
# P2 Linux secret-service 后端(credential_keyring.rs). keyring 3.x 默认不带 linux 后端,
# 开 sync-secret-service(zbus 系, 阻塞式 API 与本 crate 同步 trait 匹配). 仅 cfg(linux)
# 生效, Android(target_os=android) 与 Windows 构建不受影响.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
