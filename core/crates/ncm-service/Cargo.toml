[package]
name = "ncm-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ncm-domain.workspace = true
ncm-provider.workspace = true
ncm-api-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
# time/fs: 云盘上传要分步轮询转码状态并读本地文件
tokio = { workspace = true, features = ["sync", "time", "fs"] }
# stream: 桌面端"边下边播"(cache::AudioCache::download_progressive)要按块读响应体
# blocking: 插件宿主 Transport 是同步 trait(见 plugins/transport.rs 头注释), 复用同一套
# UA/连接超时/读超时/重试口径, 只是换同步入口。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
# 云盘上传要按秒传/查重协议给上游算文件 md5(没有现成 digest 链)
md-5 = "0.10"

# P0 Windows DPAPI 后端(credential_store.rs 的 dpapi 模块). windows-sys 0.61 已在
# 依赖树里(Cargo.lock), 选 0.61 与树中多数一致; 只开 Cryptography 所需的两个
# feature(近零增量, 且 windows-sys 是 link-only crate, 不引入编译期依赖).
# 仅 cfg(windows) 生效, Linux/Android 构建完全不受影响.
# P2 Linux secret-service 后端(credential_keyring.rs). keyring 3.x 默认不带 linux 后端,
# 开 sync-secret-service(zbus 系, 阻塞式 API 与本 crate 同步 trait 匹配). 仅 cfg(linux)
# 生效, Android(target_os=android) 与 Windows 构建不受影响.
# 插件宿主接缝(plugins::ReqwestTransport 实现 ncm-plugin 的 Transport).
# 依赖方向 service -> plugin; plugin 只依赖 domain/provider, 无环.
# **只对非 Android 目标生效**: rquickjs-sys 0.12.2 只随包提供桌面/服务端目标的预生成 bindings,
# 没有 aarch64/armv7-linux-android(或 x86_64-linux-android) 的 .rs, 交叉编译会直接
# include! 失败(bindgen feature 要额外 libclang + android sysroot, 属另一笔债务)。
# 所以插件宿主暂时只有桌面端可用; Android 侧保持"无插件"直到上游补 bindings 或我们单独做
# 交叉编译方案 —— 见 docs/remaining-batches.md §11.C 与 ncm-plugin/README §4。
[target.'cfg(not(target_os = "android"))'.dependencies]
ncm-plugin.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
